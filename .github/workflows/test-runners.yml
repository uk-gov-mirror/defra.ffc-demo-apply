name: Test-Runners
on:
  push:
    branches: [ "test/gh-runners" ]
  pull_request:
    branches: [ "test/gh-runners" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Mask secrets
        run: |
          echo "::add-mask::$PACT_USER"
          echo "::add-mask::$PACT_PASS"
      
      - name: Check PACT_USER
        run: |
          echo "PACT_USER is set: ${PACT_USER:+yes}"
          echo "PACT_USER length: ${#PACT_USER}"
          echo "PACT_USER: ${PACT_USER}"

      - name: Pact Broker connectivity
        run: |
          echo "this is the echo of the user, its a secret"
          curl -s -u "$PACT_USER:$PACT_PASS" -o /dev/null -w "%{http_code}\n" https://ffc-pact-broker.azure.defra.cloud

      - name: Install Pact Broker CLI (pact-broker-cli v0.6.3)
        run: |
          curl -fsSL https://raw.githubusercontent.com/pact-foundation/pact-broker-cli/main/install.sh | PACT_BROKER_CLI_VERSION=v0.6.3 sh

      - name: Pact Broker CLI version
        run: |
          pact-broker-cli --version

      - name: Pact Broker CLI list environments
        run: |
          pact-broker-cli list-environments -b https://ffc-pact-broker.azure.defra.cloud -u "$PACT_USER" -p "$PACT_PASS"
