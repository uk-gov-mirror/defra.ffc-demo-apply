name: Create Pact Webhooks

# Reusable workflow for managing webhooks on the FFC Pact Broker.
#
# Callable from other workflows in this repo:
#   jobs:
#     manage-webhook:
#       uses: ./.github/workflows/pact-webhooks.yml


on:
  workflow_call:
    inputs:
      webhook_consumer:
        description: 'Consumer name (required for create/update, e.g. grants-ui)'
        required: false
        type: string
      webhook_provider:
        description: 'Provider name (required for create/update, e.g. grants-ui-backend)'
        required: false
        type: string
      target_repo:
        description: 'GitHub repo path for the dispatch URL. Defaults to DEFRA/<webhook_provider> if omitted.'
        required: false
        type: string

  workflow_dispatch:
    inputs:
      webhook_consumer:
        description: 'Consumer name (required for create/update, e.g. grants-ui)'
        required: false
        type: string
      webhook_provider:
        description: 'Provider name (required for create/update, e.g. grants-ui-backend)'
        required: false
        type: string
      target_repo:
        description: 'GitHub repo path for the dispatch URL. Defaults to DEFRA/<webhook_provider> if omitted.'
        required: false
        type: string

jobs:
  webhook:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Mask secrets
        run: |
          echo "::add-mask::$PACT_USER"
          echo "::add-mask::$PACT_PASS"
          echo "::add-mask::$FFCPLATFORM_PAT"

      - name: Validate webhook inputs
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          WEBHOOK_CONSUMER: ${{ inputs.webhook_consumer }}
          WEBHOOK_PROVIDER: ${{ inputs.webhook_provider }}
        run: |
          set -euo pipefail

          : "${TARGET_REPO:?TARGET_REPO workflow input is required}"
          : "${WEBHOOK_CONSUMER:?WEBHOOK_CONSUMER workflow input is required}"
          : "${WEBHOOK_PROVIDER:?WEBHOOK_PROVIDER workflow input is required}"

      - name: Run webhook command
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          WEBHOOK_CONSUMER: ${{ inputs.webhook_consumer }}
          WEBHOOK_PROVIDER: ${{ inputs.webhook_provider }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          PACT_BROKER_URL="https://ffc-pact-broker.azure.defra.cloud"

          AUTH_HEADER=$(printf '%s' "${PACT_USER}:${PACT_PASS}" | base64 | tr -d '\n')

          curl -i -sS -X POST "${PACT_BROKER_URL}/webhooks" \
            -H "Authorization: Basic ${AUTH_HEADER}" \
            -H "Content-Type: application/json" \
            --data-binary @- <<JSON
          {
            "description": "Trigger ${TARGET_REPO} workflow for ${WEBHOOK_CONSUMER} -> ${WEBHOOK_PROVIDER}",
            "consumer": {
              "name": "${WEBHOOK_CONSUMER}"
            },
            "provider": {
              "name": "${WEBHOOK_PROVIDER}"
            },
            "request": {
              "method": "POST",
              "url": "https://api.github.com/repos/${TARGET_REPO}/dispatches",
              "headers": {
                "accept": "application/vnd.github+json",
                "authorization": "Bearer ${FFCPLATFORM_PAT}",
                "content-type": "application/json",
                "x-github-api-version": "2022-11-28"
              },
              "body": {
                "event_type": "pact_published",
                "client_payload": {
                  "pact_url": "\${pactbroker.pactUrl}",
                  "consumer": "\${pactbroker.consumerName}",
                  "provider": "\${pactbroker.providerName}",
                  "sha": "\${pactbroker.providerVersionNumber}",
                  "branch": "\${pactbroker.providerVersionBranch}",
                  "message": "Verify changed pact for \${pactbroker.consumerName} version \${pactbroker.consumerVersionNumber} branch \${pactbroker.consumerVersionBranch} by \${pactbroker.providerVersionNumber} (\${pactbroker.providerVersionDescriptions})"
                }
              }
            },
            "events": [
              {
                "name": "contract_requiring_verification_published"
              }
            ]
          }
          JSON
